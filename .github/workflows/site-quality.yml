name: Study home quality
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
# 같은 PR에 새로 푸시하면 이전 실행은 취소한다(main 푸시는 취소하지 않는다).
concurrency:
  group: site-quality-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check PR impact analysis
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 scripts/check_pr_impact.py
      - name: Check design contract, source links and generated output
        run: |
          python3 scripts/content_registry.py
          python3 scripts/validate_design_system.py
          python3 scripts/validate_site.py
          python3 scripts/build_library.py --check
          python3 scripts/build_compact_lectures.py --check
      - name: Run Python and Node regressions
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py'
          node --test tests/test_*.cjs
  browser-suite:
    name: Browser suite (${{ matrix.suite }})
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    strategy:
      fail-fast: false
      matrix:
        # WebKit runs on main, as before. PRs run both Chromium shards.
        suite: ${{ fromJSON(github.event_name == 'push' && '["chromium-1","chromium-2","webkit"]' || '["chromium-1","chromium-2"]') }}
    env:
      BROWSER_NAME: ${{ matrix.suite == 'webkit' && 'webkit' || 'chromium' }}
      PLAYWRIGHT_VERSION: '1.56.1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Playwright test runner
        run: npm install --no-save --no-audit --no-fund --prefer-offline "@playwright/test@$PLAYWRIGHT_VERSION"
      - name: Run browser tests
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          if [ "$SUITE" = "webkit" ]; then
            npx playwright test --config=tests/playwright.config.cjs tests/pwa.spec.cjs
          else
            npx playwright test --config=tests/playwright.config.cjs --shard="${SUITE#chromium-}/2"
          fi
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-${{ matrix.suite }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore

  browser:
    runs-on: ubuntu-24.04
    needs: browser-suite
    if: ${{ always() }}
    steps:
      - name: Require all browser suites to pass
        env:
          RESULT: ${{ needs.browser-suite.result }}
        run: test "$RESULT" = success
